<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Robb Owen avatar animation (standalone recreation)</title>
<style>
  :root{
    --bg:#f4f9fc;
    --line:#7f00e0;
    --fill:#aadcec;
    --text:#0f1b61;
    --subtext:#73bbc5;
    --duo:#aadcec;
  }

  *{box-sizing:border-box}

  html,body{margin:0;height:100%;background:var(--bg)}

  .avatar-demo{
    position:relative;
    width:100%;
    height:100vh;
    overflow:hidden;
  }

  /* ---------- original site rules, extracted from robbowen.digital/assets/css/styles.css ---------- */

  .avatar-wrap{perspective:1000px;position:relative;width:100%;height:100%}

  .avatar{width:60vw;height:auto;aspect-ratio:702/726;max-width:465px;position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);transform-origin:bottom center;backface-visibility:hidden;will-change:transform}

  .layer *{backface-visibility:hidden}

  .layer div,.layer svg{position:absolute;top:0;left:0;right:0;bottom:0;height:100%;width:100%}

  .svg-blank{fill:none}

  .beard,.face-tilt,.head__rotation,.head__yaw,.neck__shadow{transform-origin:50% 80%}

  .avatar--ready .beard,.avatar--ready .ears__left,.avatar--ready .ears__right,.avatar--ready .face-tilt,.avatar--ready .head__rotation,.avatar--ready .head__yaw,.avatar--ready .mouth{will-change:transform;backface-visibility:hidden;perspective:1000;transition:transform .35s ease-out}

  .avatar--ready .neck__shadow{will-change:transform;backface-visibility:hidden;perspective:1000;transition:transform .4s ease-in-out}

  .avatar--ready .neck__adamsapple{will-change:transform;animation:breath 2.5s ease-in-out infinite alternate}

  .avatar--ready .head__y{will-change:transform;animation:breathHead 2.5s ease-in-out infinite alternate}

  .avatar--ready .nose__breath{will-change:transform;animation:breathNose 2.5s ease-in-out infinite alternate}

  .avatar--ready .eyes__x,.avatar--ready .eyes__y{backface-visibility:hidden;perspective:1000;transition:all .1s ease-out 10ms}

  .avatar--ready.creeper .eyes__x,.avatar--ready.creeper .eyes__y{backface-visibility:hidden;perspective:1000;transition:all .3s ease-in-out}

  .avatar--ready .eyebrow{transition:all .36s ease-in-out}

  .avatar--ready .eyebrow,.avatar--ready .mouth path{backface-visibility:hidden;perspective:1000}

  /* "dizzy" easter egg — triggered when the mouse whips through quadrants fast */
  .dizzy .mouth svg{display:none}

  .dizzy .mouth:before{width:12%;background:var(--line);bottom:34%;transform-origin:top center;animation:breatheMouthUp 2s ease-in-out infinite alternate}

  .dizzy .mouth:after,.dizzy .mouth:before{content:"";position:absolute;height:2%;border-radius:100%;left:50%;margin-left:-6%}

  .dizzy .mouth:after{transform-origin:bottom center;width:16%;border-bottom-left-radius:0;border-bottom-right-radius:0;background:var(--bg);bottom:33%;width:12%;animation:breatheMouth 2s ease-in-out infinite alternate}

  .dizzy .eyebrows__left{animation:dizzyBrowL 2s ease-in-out infinite alternate}

  .dizzy .eyebrows__right{animation:dizzyBrowR 2s ease-in-out infinite alternate}

  .dizzy .eyes__left .eye__dot{animation:dizzyEyeL 2.5s ease-in infinite alternate}

  .dizzy .eyes__right .eye__dot{animation:dizzyEyeR 2.5s ease-in infinite alternate-reverse}

  .dizzy .eyes__x,.dizzy .eyes__y{transform:none}

  .dizzy .head__yaw{animation:dizzyYaw 2.5s ease-in-out infinite alternate}

  .dizzy .head__rotation{animation:dizzySway 1.5s ease-in-out infinite alternate}

  .bgmask{fill:var(--bg)}

  /* clip-path uses the CSS path() function (inline path data) instead of url(#id):
     under file:// Chrome treats a clip-path/mask/filter url(#id) as a potential
     external-document fetch and blocks it as an "unsafe" cross-origin load, even
     when the id is in the very same document. path() has no such restriction. */
  .mask--chin{clip-path:path("M351,538.29a133.13,133.13,0,0,1-53.48-11.11v70.14H404.49V527.18A133.22,133.22,0,0,1,351,538.29Z")}

  .mask--eyebrow-l{clip-path:path("M224.5,213.67h87.98v87.98h-87.98Z")}

  .mask--eyebrow-r{clip-path:path("M376.36,220.19h98.52v85.33h-98.52Z")}

  .svg-pattern{fill:url(#pattern--stubble)}

  /* one-shot entrance animation (plays once on load because of the --intro class) */
  .avatar--intro .avatar__animwrap{backface-visibility:hidden;transform-origin:center bottom;animation:bakedAvatar 1.5s cubic-bezier(.215,.61,.355,1) .2s backwards}

  .avatar--intro .eyebrows,.avatar--intro .hair,.avatar--intro .mouth,.avatar--intro .nose,.avatar--intro .shading{backface-visibility:hidden;animation:bakedSecondary 1.5s cubic-bezier(.215,.61,.355,1) .2s backwards}

  .avatar--intro .head__y{transform-origin:center 75%;animation:headIn .975s cubic-bezier(.215,.61,.355,1) .2s backwards}

  .avatar--intro .eyes__glasses{backface-visibility:hidden;transform-origin:center bottom;animation:bakedGlasses 1.5s ease-out .2s backwards}

  .avatar__animwrap{position:absolute;top:0;left:0;right:0;bottom:0;backface-visibility:hidden;transform-origin:bottom center}

  .svg-stroke{fill:none;stroke:var(--line);stroke-width:2.5px;stroke-linecap:round;stroke-linejoin:round;stroke-miterlimit:10;vector-effect:non-scaling-stroke}

  @media(min-width:512px){.svg-stroke{stroke-width:3px}}

  .svg-fill-stroke{fill:var(--line)}

  .svg-fill{fill:var(--fill,var(--bg))}

  .svg-stroke-thin{fill:none;stroke:var(--line);stroke-width:2.5px;stroke-linecap:round;stroke-linejoin:round;stroke-miterlimit:10;vector-effect:non-scaling-stroke}

  .svg-bg{fill:var(--bg)}

  @media screen and (max-width:512px){.avatar .svg-stroke,.avatar .svg-stroke-thin{stroke-width:.9vw}}

  @media screen and (min-width:513px)and (max-width:1200px){.avatar .svg-stroke,.avatar .svg-stroke-thin{stroke-width:2.5px}}

  @keyframes breatheMouthUp{0%{transform:translateY(2px) scale(.9)}to{transform:translateY(0) scale(.85,1.25)}}

  @keyframes breatheMouth{to{transform:scaleY(.5)}}

  @keyframes breath{to{transform:none}0%{transform:translateY(2px)}}

  @keyframes breathHead{to{transform:translateY(4px)}0%{transform:translateY(0)}}

  @keyframes breathNose{to{transform:none}0%{transform:translateX(-24px) scaleX(1.075)}}

  @keyframes dizzySway{0%{transform:rotate(-2deg)}to{transform:rotate(2deg)}}

  @keyframes dizzyEyeL{0%{transform:translate(68px,85px) scale(.75)}}

  @keyframes dizzyEyeR{0%{transform:translate(108px,85px) scale(.75)}}

  @keyframes dizzyYaw{0%{transform:translateY(-2px)}to{transform:translateY(5px)}}

  @keyframes dizzyBrowL{0%{transform:translateY(-5px)}to{transform:translateY(5px)}}

  @keyframes dizzyBrowR{0%{transform:translateY(10px)}to{transform:translateY(0)}}

<script>
(function(){
  "use strict";

  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var avatarReady = document.querySelector(".avatar--ready");
  var avatarEl = document.querySelector(".avatar");
  if (!avatarReady || reduceMotion) return;

  var headYaw = avatarReady.querySelector(".head__yaw");
  var headRotations = Array.prototype.slice.call(avatarReady.querySelectorAll(".head__rotation"));
  var faceTilts = Array.prototype.slice.call(avatarReady.querySelectorAll(".face-tilt"));
  var eyesX = avatarReady.querySelector(".eyes__x");
  var eyesY = avatarReady.querySelector(".eyes__y");
  var browLeft = avatarReady.querySelector(".eyebrows__left");
  var browRight = avatarReady.querySelector(".eyebrows__right");
  var earLeft = avatarReady.querySelector(".ears__left");
  var earRight = avatarReady.querySelector(".ears__right");
  var beard = avatarReady.querySelector(".beard");
  var mouthPath = avatarReady.querySelector(".mouth path");
  var mouthSvg = mouthPath.parentElement;

  // mouth pose presets reverse-engineered from robbowen.digital/assets/js/main.js
  var MOUTH_NEUTRAL = { y: 0,  d: "M299.3,461.3c28.3,15.2,81.2,15.2,102.4-0.4" };
  var MOUTH_UP      = { y: 0,  d: "M300.33,467.31c25.75,8.49,90,6.12,99.4-8.42" };
  var MOUTH_DOWN    = { y: -2, d: "M300.7,467.2c26.6,8.8,84.6,6.2,102.7-0.7" };
  var MOUTH_DURATION = 450;

  function clamp(min, max, v){ return Math.min(Math.max(v, min), max); }

  function parseNums(d){ return d.match(/-?\d+\.?\d*/g).map(Number); }
  function buildD(n){ return "M" + n[0] + "," + n[1] + "c" + n[2] + "," + n[3] + "," + n[4] + "," + n[5] + "," + n[6] + "," + n[7]; }

  var easeOutQuad = function(t){ return 1 - Math.pow(1 - t, 2); };

  var currentMouth = MOUTH_NEUTRAL;
  var mouthTweenId = 0;

  function setMouth(target){
    if (target === currentMouth) return;
    var fromNums = parseNums(currentMouth.d);
    var toNums = parseNums(target.d);
    var fromY = currentMouth.y;
    var toY = target.y;
    currentMouth = target;

    var myId = ++mouthTweenId;
    var start = null;

    function frame(now){
      if (myId !== mouthTweenId) return; // superseded by a newer target
      if (start === null) start = now;
      var t = clamp(0, 1, (now - start) / MOUTH_DURATION);
      var e = easeOutQuad(t);
      var nums = fromNums.map(function(v, i){ return v + (toNums[i] - v) * e; });
      mouthPath.setAttribute("d", buildD(nums));
      mouthSvg.style.transform = "translateY(" + (fromY + (toY - fromY) * e) + "px)";
      if (t < 1) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  // --- dizzy easter egg: whip the mouse through quadrants fast enough and the avatar gets dizzy ---
  var prevQuadrant = 0;
  var quadrantFlips = 0;

  function triggerDizzy(){
    avatarEl.classList.add("dizzy");
    quadrantFlips = 0;
    setTimeout(function(){ avatarEl.classList.remove("dizzy"); }, 6000);
  }

  function update(targetX, targetY){
    if (avatarEl.classList.contains("dizzy")) return;

    var size = { x: window.innerWidth, y: window.innerHeight };

    var O = (targetX - size.x / 2) / (size.x / 2);
    var Y = (targetY - size.y / 2) / (size.y / 2);
    var C = clamp(-1, 1, (targetX - size.x / 2) / (size.x / 4));
    var L = clamp(-1, 1, (targetY - size.y / 2) / (size.y / 4));

    var quadrant;
    if (L < 0 && C < 0) quadrant = 1;
    else if (L < 0 && C >= 0) quadrant = 2;
    else if (L >= 0 && C >= 0) quadrant = 3;
    else quadrant = 4;

    if (quadrant !== prevQuadrant) {
      prevQuadrant = quadrant;
      quadrantFlips += 1;
      setTimeout(function(){ quadrantFlips = Math.max(0, quadrantFlips - 1); }, 500);
    }
    if (quadrantFlips >= 5) {
      triggerDizzy();
      return;
    }

    eyesX.style.transform = "translateX(" + Math.ceil(10 * O) + "px)";
    var eyeYval = Math.ceil(10 * Y);
    eyesY.style.transform = "translateY(" + (eyeYval < -3 ? -3 : eyeYval) + "px)";

    headYaw.style.transform = "translateY(" + (L < 0 ? Math.ceil(1 * L) : Math.ceil(3 * L)) + "px)";

    headRotations.forEach(function(el){
      el.style.transform = "rotate(" + (3 * C * L) + "deg)";
    });

    faceTilts.forEach(function(el){
      var ty = L < 0 ? Math.ceil(1 * L) : Math.ceil(3 * L);
      el.style.transform = "translateY(" + ty + "px) translateX(" + Math.ceil(1.25 * C) + "px)";
    });

    earLeft.style.transform = "translateX(" + (C < 0 ? Math.ceil(1 * C) : Math.ceil(-1 * C)) + "px)";
    earRight.style.transform = "translateX(" + (C < 0 ? Math.ceil(-1 * C) : Math.ceil(1 * C)) + "px)";

    browLeft.style.transform = "translateY(" + (C < 0 ? -5 + Math.ceil(2 * C) : -5 + Math.ceil(5 * C)) + "px)";
    browRight.style.transform = "translateY(" + (C < 0 ? -3 + Math.ceil(-5 * C) : -3 + Math.ceil(-3 * C)) + "px)";

    beard.style.transform = L < 0 ? "scaleY(" + (1 + -1 * L * 0.025) + ")" : "scaleY(" + (1 - 0.025 * L) + ")";

    var mouthTarget;
    if ((C < -0.5 && L < -0.5) || (C > 0.5 && L < -0.5)) mouthTarget = MOUTH_UP;
    else if ((C < -0.5 && L > 0.5) || (C > 0.5 && L > 0.5) || L > 0.5) mouthTarget = MOUTH_DOWN;
    else mouthTarget = MOUTH_NEUTRAL;
    setMouth(mouthTarget);
  }

  // --- drive updates off mousemove, decoupled onto rAF ---
  var pendingX = window.innerWidth / 2;
  var pendingY = window.innerHeight / 2;
  var hasMoved = false;
  var ticking = false;

  window.addEventListener("mousemove", function(e){
    pendingX = e.clientX;
    pendingY = e.clientY;
    hasMoved = true;
    if (!ticking) {
      ticking = true;
      requestAnimationFrame(function(){
        update(pendingX, pendingY);
        ticking = false;
      });
    }
  });

  // --- optional: mobile tilt support (device orientation), mirrors the desktop mouse behaviour ---
  window.addEventListener("deviceorientation", function(e){
    if (hasMoved || e.gamma === null || e.beta === null) return;
    var size = { x: window.innerWidth, y: window.innerHeight };
    var M = clamp(-1, 1, e.gamma / 22.5);
    var S = clamp(-1, 1, e.beta / 45);
    var x = size.x / 2 + (size.x / 2) * (-0.66 * M);
    var y = size.y / 2 + (size.y / 2) * (-0.66 * S);
    if (!ticking) {
      ticking = true;
      requestAnimationFrame(function(){
        update(x, y);
        ticking = false;
      });
    }
  });
})();
