<style>
/* Layout: full-screen 3D blueprint world under a thin HUD; zone panel docks right (bottom sheet on phones). Single deliberate dark "blueprint" look. */
:root{
  --ground:#e9dcb8;
  --deep:#f3e9d2;
  --panel:#1d2a3a;
  --line:#3a4d63;
  --ink:#f6efe0;
  --muted:#b7c0cc;
  --kart:#f2b705;
  --coral:#e0452b;
  --mint:#2fa28c;
  --lilac:#6a5acd;
  --dark:#1d2a3a;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden}
body{background:var(--deep);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.hud .brand b,.hud .keys,.hud .keys kbd{color:var(--dark)}
.hud .keys kbd{border-color:#b9a572;background:#f6efe0}
.hud .keys{background:color-mix(in srgb,#f6efe0 82%,transparent);border-radius:12px;padding:8px 12px;backdrop-filter:blur(4px)}
.hud .brand span{color:#6b6250}
.hud .brand .wind{display:block;margin-top:6px;font:500 11px var(--f-mono);letter-spacing:.06em;color:#6b6250}
.hud .brand .wind em{font-style:normal;color:var(--dark);font-weight:700}
.sound{pointer-events:auto;font:600 12px var(--f-body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 12px;cursor:pointer;display:flex;align-items:center;gap:7px}
.sound:focus-visible{outline:2px solid var(--dark);outline-offset:2px}
.sound .bars{display:flex;gap:2px;align-items:flex-end;height:12px}
.sound .bars i{width:3px;background:var(--kart);height:4px;border-radius:1px;transition:height .15s}
.sound.on .bars i:nth-child(1){animation:eq .7s infinite alternate}.sound.on .bars i:nth-child(2){animation:eq .5s .1s infinite alternate}.sound.on .bars i:nth-child(3){animation:eq .9s .2s infinite alternate}
@keyframes eq{from{height:3px}to{height:12px}}
.airtime{position:fixed;left:50%;top:18%;transform:translate(-50%,0) scale(.6);opacity:0;font:800 clamp(28px,7vw,54px) var(--f-display);color:var(--coral);-webkit-text-stroke:2px var(--ink);letter-spacing:.04em;pointer-events:none;transition:all .25s}
.airtime.show{opacity:1;transform:translate(-50%,0) scale(1) rotate(-4deg)}
.minimap{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(max(16px,env(safe-area-inset-bottom,0px)) + 48px);width:120px;height:120px;border-radius:50%;overflow:hidden;border:3px solid var(--panel);background:#0f3f66;padding:0;cursor:pointer;box-shadow:0 10px 30px -12px #0008}
.minimap canvas{width:100%;height:100%;display:block}
.minimap span{position:absolute;left:0;right:0;bottom:6px;text-align:center;font:700 10px var(--f-mono);letter-spacing:.08em;color:var(--ink);text-shadow:0 1px 2px #000}
.minimap:focus-visible{outline:2px solid var(--dark);outline-offset:2px}
@media (pointer:coarse){.minimap{bottom:calc(max(16px,env(safe-area-inset-bottom,0px)) + 92px);width:92px;height:92px}}
.mapview{position:fixed;inset:0;display:grid;place-items:center;background:#0b1a2acc;backdrop-filter:blur(4px);z-index:20;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
[hidden]{display:none!important}
.mapcard{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;width:min(92vw,640px);max-height:92vh;overflow:auto}
.maphead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
.maphead h2{font-family:var(--f-display);font-size:22px;margin:2px 0 0}
.maphead .tag{font:700 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--kart)}
.mapwrap{border-radius:14px;overflow:hidden;background:#0f3f66}
.mapwrap canvas{width:100%;height:auto;display:block;aspect-ratio:1;max-width:100%}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:12px;font:500 12px var(--f-mono);color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;background:var(--c);display:inline-block}
.legend i.sq{border-radius:2px}
.legend .projlist{flex-basis:100%;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px 14px;margin-top:8px;padding-top:10px;border-top:1px dashed var(--line)}
.legend .projlist b{color:var(--coral);margin-right:4px}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
/* achievements: console-style toasts under the name card, and a list of all of them */
.toasts{position:fixed;top:calc(max(16px,env(safe-area-inset-top,0px)) + 104px);left:max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px;z-index:30;pointer-events:none;width:min(330px,calc(100vw - 32px))}
.toast{background:#0f1416f2;border:1px solid #2b3a3e;border-radius:12px;padding:12px 14px;color:var(--ink);box-shadow:0 10px 30px #0008;transform:translateX(-120%);opacity:0;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .4s;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.toast.in{transform:none;opacity:1}
.toast .ttl{font:800 14px var(--f-display);color:#cfe96a;letter-spacing:.03em;text-transform:uppercase}
.toast .prog{font:700 12px var(--f-mono);color:#8fe36a;display:flex;align-items:center;gap:6px;justify-self:end}
.toast .prog svg,.toast .ico{width:16px;height:16px;fill:none;stroke-linecap:round;stroke-linejoin:round}
.toast .prog svg{stroke:#8fe36a;stroke-width:3}
.toast .desc{font:500 13px/1.35 var(--f-body);color:#dbe3ea}
.toast .ico{stroke:#9aa6b2;stroke-width:2;justify-self:end;align-self:start}
.achlist{display:flex;flex-direction:column}
.achrow{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px dashed var(--line)}
.achrow:first-child{border-top:0}
.achrow .mark{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.achrow .mark svg{width:16px;height:16px;fill:none;stroke:#8fe36a;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.achrow.done .mark{border-color:#8fe36a;background:#8fe36a22}.achrow.done .mark svg{opacity:1}
.achrow .ttl{font:800 13px var(--f-display);color:var(--muted);letter-spacing:.03em;text-transform:uppercase}.achrow.done .ttl{color:#cfe96a}
.achrow .desc{font:500 13px var(--f-body);color:var(--muted)}
.achrow .prog{font:700 12px var(--f-mono);color:var(--muted)}.achrow.done .prog{color:#8fe36a}
.sound.ach{margin-right:8px}
@media (max-width:640px){.toasts{top:calc(max(16px,env(safe-area-inset-top,0px)) + 96px)}}

body.pre .hud,body.pre .minimap{opacity:0;pointer-events:none}
.minimap{transition:opacity .6s}
.hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;transition:opacity .6s;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px))}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.brand{pointer-events:auto;background:color-mix(in srgb,#f6efe0 82%,transparent);border-radius:14px;padding:10px 14px;backdrop-filter:blur(4px)}
.brand b{display:block;font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:.06em}
.brand span{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.chips{display:flex;gap:6px;flex-wrap:wrap;pointer-events:auto}
.chip{font:600 12px/1 var(--f-body);color:var(--ink);background:color-mix(in srgb,var(--panel) 85%,transparent);border:1px solid var(--line);border-radius:999px;padding:8px 12px 8px 10px;cursor:pointer;display:flex;align-items:center;gap:7px}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip:hover,.chip:focus-visible{border-color:var(--c);outline:none}
.bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.keys{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.04em;display:flex;gap:14px;flex-wrap:wrap}
.keys kbd{font:700 11px var(--f-mono);color:var(--ink);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 5px;margin-right:4px}

/* touch controls: drag anywhere on the right half to drive (a stick appears under the finger); one big jump button on the left */
.touch{display:none}
.stickzone{position:fixed;top:0;right:0;bottom:0;width:50%;touch-action:none;pointer-events:auto;z-index:3;user-select:none;-webkit-user-select:none}
.stickzone .hint{position:absolute;left:50%;bottom:calc(max(16px,env(safe-area-inset-bottom,0px)) + 112px);transform:translateX(-50%);white-space:nowrap;font:600 12px var(--f-body);color:var(--ink);background:color-mix(in srgb,var(--panel) 80%,transparent);border:1px solid var(--line);border-radius:999px;padding:7px 12px;transition:opacity .5s;pointer-events:none}
.stickzone.used .hint{opacity:0}
.stick{position:absolute;width:124px;height:124px;margin:-62px 0 0 -62px;border-radius:50%;border:2px solid #f6efe0aa;background:#1d2a3a66;pointer-events:none;--dx:0px;--dy:0px}
.stick i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;background:var(--kart);box-shadow:0 4px 12px #0006;transform:translate(var(--dx),var(--dy))}
.jump{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(max(16px,env(safe-area-inset-bottom,0px)) + 14px);width:92px;height:92px;border-radius:50%;border:0;background:var(--coral);color:var(--ink);box-shadow:0 6px 18px #0005;z-index:3;display:grid;place-items:center;gap:0;touch-action:none;user-select:none;-webkit-user-select:none;pointer-events:auto;padding:0}
.jump b{font:800 26px/1 var(--f-mono)}.jump span{font:800 11px var(--f-display);letter-spacing:.08em}
.jump:active{transform:scale(.94)}
@media (pointer:coarse){.touch{display:block}.keys{display:none}.hud .bottom{flex-direction:column;align-items:center;gap:8px}.sound.ach{margin-right:0}} /* the pills sit between the jump button and the minimap */

.panel{position:fixed;top:50%;right:max(16px,env(safe-area-inset-right,0px));width:min(380px,calc(100vw - 32px));max-height:min(78vh,640px);overflow:auto;
  transform:translate(calc(100% + 40px),-50%);transition:transform .45s cubic-bezier(.2,.9,.25,1.15);
  background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px 22px 20px;box-shadow:0 20px 50px -20px #000a}
.panel.open{transform:translate(0,-50%)}
.panel .tag{font:700 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--zc)}
.panel h2{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1.1;margin:6px 0 12px;text-wrap:balance}
.panel p{margin:0 0 12px;color:var(--ink)}
.panel .note{font:500 11px var(--f-mono);color:var(--muted);margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:4px 0 6px}
.facts dt{font:500 11px/1.9 var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.facts dd{margin:0}
.proj{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.proj li{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.proj b{display:block;font-weight:600}
.proj small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.stack{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.stack span{font:500 11px var(--f-mono);border-radius:6px;padding:2px 7px;background:color-mix(in srgb,var(--zc) 18%,transparent);color:var(--ink)}
.skills{display:flex;flex-direction:column;gap:12px}
.skills h3{font:700 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.mail{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.mail code{font:700 14px var(--f-mono);user-select:all;flex:1;min-width:0;overflow-wrap:anywhere}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.links a{font:600 13px var(--f-body);color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:7px 12px;background:color-mix(in srgb,var(--zc) 16%,transparent)}
.links a:hover,.links a:focus-visible{border-color:var(--zc);outline:none}
.btn{font:600 13px var(--f-body);background:var(--zc,var(--kart));color:var(--deep);border:0;border-radius:9px;padding:8px 12px;cursor:pointer}
.btn:focus-visible,.chip:focus-visible,.touch button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media (max-width:640px){
  .panel{top:auto;bottom:calc(max(16px,env(safe-area-inset-bottom,0px)) + 84px);right:max(16px,env(safe-area-inset-right,0px));max-height:44vh;transform:translateY(calc(100% + 140px))}
  .panel.open{transform:translateY(0)}
  .panel h2{font-size:21px}
  .chip{padding:7px 10px;font-size:11px}
}

/* start screen: the island is already visible behind, the truck waits inside a glowing ring and a hand-written "click to start" points at it */
.intro{position:fixed;inset:0;z-index:40;background:var(--deep);transition:opacity .5s,background .8s;cursor:pointer;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.intro.ready{background:transparent}
.intro.gone{opacity:0;pointer-events:none}
.start{position:absolute;right:4%;top:20%;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;transform:rotate(-7deg)}
.start .arrow{width:70px;height:46px;stroke:#fff;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;align-self:flex-start;margin:0 0 -6px -58px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.45))}
.start .go{font:400 clamp(30px,4vw,44px)/1 'Permanent Marker',var(--f-display),cursive;max-width:7em;color:#fff;background:none;border:0;padding:0;cursor:pointer;text-transform:uppercase;letter-spacing:.02em;
  text-shadow:0 2px 10px rgba(0,0,0,.55),0 0 24px rgba(179,136,255,.45);animation:breathe 1.6s ease-in-out infinite alternate}
.start .go[disabled]{font:500 14px var(--f-mono);letter-spacing:.14em;color:var(--muted);animation:none;cursor:progress;text-shadow:none}
.start .go:focus-visible{outline:2px solid #fff;outline-offset:6px;border-radius:8px}
.start .mute{pointer-events:auto;width:46px;height:40px;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;background:none;border:0;padding:0;cursor:pointer;filter:drop-shadow(0 2px 6px rgba(0,0,0,.45));margin-top:6px}
.start .mute svg{width:100%;height:100%;display:block}
.start .mute .waves{transition:opacity .2s}.start .mute.off .waves{opacity:0}.start .mute .cross{opacity:0}.start .mute.off .cross{opacity:1}
.start .mute:focus-visible{outline:2px solid #fff;outline-offset:4px;border-radius:8px}
.start .load{font:500 12px var(--f-mono);color:var(--muted);display:flex;align-items:center;gap:10px;width:220px;transform:rotate(7deg)}
.start .load .bar{flex:1;height:6px;border-radius:3px;background:#2a3a4e;overflow:hidden}
.start .load .bar i{display:block;height:100%;width:0;background:var(--kart);transition:width .3s}
.start .load.done{display:none}
.start .fail{font:500 12px var(--f-mono);color:#ffb3a7;background:#3a1f2a;border:1px solid #7a3a3a;border-radius:10px;padding:10px 12px;overflow-wrap:anywhere;max-width:300px;transform:rotate(7deg)}
@keyframes breathe{from{transform:scale(1)}to{transform:scale(1.05)}}
@media (max-width:640px){.start{right:auto;left:50%;top:auto;bottom:16%;transform:translateX(-50%) rotate(-5deg)}.start .arrow{display:none}}
@media (prefers-reduced-motion:reduce){.panel,.intro{transition:none}.start .go{animation:none}}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
function showFail(msg){
  const h = document.getElementById('fail'); if (!h) return;
  h.hidden = false; h.textContent = 'No se pudo iniciar el mundo 3D: ' + msg;
}
window.addEventListener('error', e=>{ if (!window.__started3d) showFail(e.message || 'error desconocido'); });
window.addEventListener('unhandledrejection', e=>{ if (!window.__started3d) showFail((e.reason && e.reason.message) || String(e.reason)); });
(async function(){
if (typeof THREE === 'undefined'){ showFail('la librería 3D no cargó (revisa la conexión o un bloqueador).'); return; }

  skyMat.uniforms.bot.value = lerpCol(new T.Color(),a.bot,b.bot,e);

  skyMat.uniforms.glow.value = a.glow+(b.glow-a.glow)*e;
  renderer.toneMappingExposure = a.ex+(b.ex-a.ex)*e;
  scene.fog.color = lerpCol(scene.fog.color,a.fog,b.fog,e);

  lampMatNight.emissiveIntensity = .4 + night; tailMat.emissiveIntensity = .3 + night*.8;
  windowsMat.emissiveIntensity = night*.9;
  return night;
}

    return (h(xi,yi)*(1-u)+h(xi+1,yi)*u)*(1-v) + (h(xi,yi+1)*(1-u)+h(xi+1,yi+1)*u)*v; };

// Flat play area in the middle, rolling dunes to the north/east/south, and a winding coastline
// on the west that sends the sea into two bays, leaving an open sandy beach strip between them.
const SEA_Y = -1.1, WORLD = 150;
const coastCache = new Map();
function coastX(z){ const k = Math.round(z*4); let v = coastCache.get(k); if (v !== undefined) return v; v = coastXraw(z); if (coastCache.size < 20000) coastCache.set(k, v); return v; }

const lagoons = [[60,-48,16],[16,74,13],[-22,-84,14]];
const ISLET = [60,-48]; // a little grassy islet with a pink tree in the middle of the first lagoon
const isletK = (x,z) => { const u = Math.max(0, Math.min(1, (Math.hypot(x-ISLET[0],z-ISLET[1]) - 2.6)/3.0)); return u*u*(3-2*u); }; // 0 on the flat top, 1 past the shore
const ZPOS = [[0,-40],[42,-8],[-36,-10],[0,42]];
const MON = [-8,-62], MON_R = 9.5, MON_A = Math.atan2(62, 8); // the monument plaza: a half-moon of stone statues facing its centre, away from the projects
const FLATS = [[-34,-54,9,17],[0,15,13,2.5],[MON[0],MON[1],17,15]]; // x, z, half-width, half-length: flattened rectangles (bowling lane, name, monuments)
const dunes = [[62,-34,4.5,22],[52,48,3.5,18],[-6,-78,5,26],[88,10,6,30],[20,86,4,24],[-30,70,3,16],[70,-75,5,28],[-70,-70,4,22]];
function terrainH(x,z){
  const r = Math.hypot(x,z);
  let h = 0;
  if (r > 88){ const t = Math.min(1,(r-88)/26); h += t*t*(1-t)*4*(7 + fbm(x*.04,z*.04)*5); }     // ring of dunes near the shore
  if (r > 112){ const t = Math.min(1,(r-112)/16); h = Math.min(h, 1.2) - t*t*5; }                 // the whole world is an island: ocean all around
  for (const [lx,lz,lr] of lagoons){ const d=Math.hypot(x-lx,z-lz); if (d < lr){ const t=1-d/lr; h = Math.min(h, 1 - t*t*(3-2*t)*6.5); } }
  for (const [dx,dz,dh,dr] of dunes){ const d = Math.hypot(x-dx,z-dz); if (d < dr){ const t = 1-d/dr; h += dh*t*t*(3-2*t) * (0.8+fbm(x*.08,z*.08)*.4); } }
  h += (fbm(x*.03+9, z*.03+4)-.5)*1.6;                                                          // gentle rolling sand
  const cx = coastX(z), dc = x - cx;                                                             // distance inland from the waterline
  if (dc < 16){ const t = Math.min(1,(16-dc)/22); h = Math.min(h, 1.2) - t*t*3.6; }               // beach slopes down into the sea
  h += fbm(x*.18, z*.18)*.08 - .04;
  { const di = Math.hypot(x-ISLET[0], z-ISLET[1]);                                                 // the islet: a pond carved around it, and the islet rising in the middle
    if (di < 11){ const u = Math.max(0, Math.min(1, (di-5.6)/5.4)), w = u*u*(3-2*u); h = h*w + (SEA_Y-1.8)*(1-w);
      const k = isletK(x,z); if (k < 1) h = Math.max(h, SEA_Y + 1.5 - k*5); } }
  for (const [zx,zz] of ZPOS){ const d=Math.hypot(x-zx,z-zz); if (d < 12){ const t=Math.min(1,d/12); h *= t*t*(3-2*t); } }   // flat pads under each section
  for (const [fx,fz,hw,hl] of FLATS){ const ex=Math.abs(x-fx)-hw, ez=Math.abs(z-fz)-hl, e=Math.max(ex,ez); if (e < 4){ const t=Math.max(0,Math.min(1,e/4)); h *= t*t*(3-2*t); } }
  if (r < 34) h *= Math.max(0, (r-8)/26) * (h>0?1:1);                                            // start area flat
  if (r < 8) h = 0;
  return h;
}
function inWater(x,z,m=0){ return terrainH(x,z) < SEA_Y + .35 - m; }
// how grassy a spot is: sand by the sea and lagoons and on the tall dune ring, meadow inland
function grassiness(x,z,h){
  if (h===undefined) h = terrainH(x,z);
  const dc = x - coastX(z), r = Math.hypot(x,z);
  let g = Math.max(0, Math.min(1, (dc-10)/16));              // beach strip stays sandy
  for (const [lx,lz,lr] of lagoons){ const d=Math.hypot(x-lx,z-lz); g *= Math.max(0, Math.min(1, (d-lr+1)/7)); }   // lagoon shores sandy
  if (isletK(x,z) < .6) g = 1;                                    // the islet is a green patch
  if (h < SEA_Y+1.0) g = 0;
  g *= 1 - Math.max(0, Math.min(1, (r-100)/14));              // outer dune ring sandy
  g *= .55 + fbm(x*.05+11, z*.05+5)*.9;                       // patchy
  return Math.max(0, Math.min(1, g));
}

}

// ---------- wind shader shared by grass and leaves: bends with the wind, darker at the base and lighter at the tips ----------
const grassU = {uTime:{value:0}, uWind:{value:.5}, uWx:{value:1}, uWz:{value:0}};
// amp: sway amplitude, lean: how far the wind pushes the tips, grad: [base tint, tip tint]; the normal keeps pointing the same way on both faces so blades never go black from behind
function windify(m, amp, lean, grad){
  m.onBeforeCompile = sh => {
    sh.uniforms.uTime = grassU.uTime; sh.uniforms.uWind = grassU.uWind; sh.uniforms.uWx = grassU.uWx; sh.uniforms.uWz = grassU.uWz;
    sh.vertexShader = 'uniform float uTime, uWind, uWx, uWz; varying float vH;\n' + sh.vertexShader.replace('#include <project_vertex>',
      `vec4 mvPosition = vec4( transformed, 1.0 );
       #ifdef USE_INSTANCING
         mvPosition = instanceMatrix * mvPosition;
       #endif
       vH = uv.y;
       float h = uv.y * uv.y;
       float sw = sin(uTime*2.2 + mvPosition.x*.35 + mvPosition.z*.27) * ${amp} * (.4 + uWind) * h + sin(uTime*5.0 + mvPosition.x*1.3 + mvPosition.z*.9) * ${amp*.2} * h;
       mvPosition.x += uWx*${lean}*h*(.2 + uWind*.5) + sw; mvPosition.z += uWz*${lean}*h*(.2 + uWind*.5) + sw*.4;
       mvPosition = modelViewMatrix * mvPosition;
       gl_Position = projectionMatrix * mvPosition;`);
    sh.fragmentShader = 'varying float vH;\n' + sh.fragmentShader
      .replace('#include <color_fragment>', `#include <color_fragment>
       diffuseColor.rgb *= mix(vec3(${grad[0].join(',')}), vec3(${grad[1].join(',')}), vH*vH);`)
      .replace('#include <normal_fragment_begin>', `#include <normal_fragment_begin>
       normal = normalize(vNormal); geometryNormal = normal;`);
  };
  return m;
}

// ---------- audio: generative lo-fi track, engine and FX (all synthesized live) ----------
const audio = (()=>{
  let ctx, master, music, fx, engGain, engOsc, engOsc2, engFilter, timer, enabled = true, on = false;
  try { enabled = localStorage.getItem('empleado-music') !== 'off'; } catch(e){}
  // Slow jazz ballad for solo piano and a soft upright bass. Nothing is sampled: each note is a stack of
  // decaying harmonics shaped like a struck string, run through a short synthetic room reverb.
  const BPM = 62, STEP = 60/BPM/4; // 16th note
  const prog = [ // ii–V–I–vi in C, then IV–iii–ii–V with borrowed colors; [bass, chord tones (MIDI)]
    [50,[57,60,64,67]],  // Dm9
    [55,[59,62,65,69]],  // G13
    [48,[55,59,64,67]],  // Cmaj9
    [57,[55,60,64,67]],  // Am9
    [53,[57,60,64,69]],  // Fmaj7(13)
    [52,[55,59,62,67]],  // Em7
    [50,[57,60,65,69]],  // Dm7(11)
    [55,[59,62,65,70]],  // G7(b9)
  ];
  const scale = [60,62,64,65,67,69,71,72,74,76,77,79,81];
  let step = 0, nextT = 0, mel = 7, lastMel = -8, phraseRest = 0;
  function noise(len){ const b = ctx.createBuffer(1, ctx.sampleRate*len, ctx.sampleRate); const d = b.getChannelData(0); for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1; return b; }
  let noiseBuf, reverb;
  const f = n => 440*Math.pow(2,(n-69)/12);
  function hit(dest, t, len, filterType, freq, vol){
    const src = ctx.createBufferSource(); src.buffer = noiseBuf;
    const fl = ctx.createBiquadFilter(); fl.type = filterType; fl.frequency.value = freq;
    const g = ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t+len);
    src.connect(fl).connect(g).connect(dest); src.start(t); src.stop(t+len+.05);
  }
  function piano(dest, midi, t, vel, len){
    const fr = f(midi), g = ctx.createGain(), bright = Math.min(1, vel*1.4);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vel, t+.008); g.gain.setTargetAtTime(vel*.35, t+.02, .25); g.gain.setTargetAtTime(0, t+len, .12);
    [[1,1],[2,.5*bright],[3,.25*bright],[4,.12*bright],[6,.05*bright]].forEach(([h,a],i)=>{
      const o = ctx.createOscillator(), og = ctx.createGain(); o.type = i===0 ? 'triangle' : 'sine'; o.frequency.value = fr*h*(1 + i*.0004); og.gain.value = a;
      og.gain.setTargetAtTime(a*.3, t+.05, .5 / h); o.connect(og).connect(g); o.start(t); o.stop(t+len+.8); });
    // hammer click
    const src = ctx.createBufferSource(); src.buffer = noiseBuf; const hg = ctx.createGain(); hg.gain.setValueAtTime(vel*.08, t); hg.gain.exponentialRampToValueAtTime(.0001, t+.02);
    const hf = ctx.createBiquadFilter(); hf.type='bandpass'; hf.frequency.value = fr*2; src.connect(hf).connect(hg).connect(g); src.start(t); src.stop(t+.03);
    g.connect(dest);
  }
  function bass(dest, midi, t, vel, len){
    const o = ctx.createOscillator(), o2 = ctx.createOscillator(), g = ctx.createGain(), fl = ctx.createBiquadFilter();
    o.type='triangle'; o.frequency.value = f(midi); o2.type='sine'; o2.frequency.value = f(midi)*2; fl.type='lowpass'; fl.frequency.value = 420;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vel,t+.015); g.gain.setTargetAtTime(0, t+len*.7, .18);
    o.connect(fl); o2.connect(fl); fl.connect(g).connect(dest); o.start(t); o2.start(t); o.stop(t+len+.6); o2.stop(t+len+.6);
  }
  function schedule(){
    while (nextT < ctx.currentTime + .3){
      const t = nextT, bar = Math.floor(step/16), s16 = step % 16;
      const [root, chord] = prog[bar % prog.length];
      const swing = (s16 % 2) ? STEP*.3 : 0, rub = (Math.random()-.5)*.012; // swing + a little rubato
      // left hand: rolled chord on 1, lighter re-strike on the "and of 2" and on 4
      if (s16 === 0) chord.forEach((n,i)=> piano(music, n, t + i*.035 + rub, .16 - i*.015, 2.4));
      if (s16 === 6 && Math.random() < .7) chord.slice(1).forEach((n,i)=> piano(music, n, t + i*.03, .07, 1.2));
      if (s16 === 12 && Math.random() < .5) chord.slice(0,3).forEach((n,i)=> piano(music, n, t + i*.03, .06, 1.0));
      // upright bass: root on 1, fifth or approach note on 3
      if (s16 === 0) bass(music, root-12, t, .32, 1.6);
      if (s16 === 8) bass(music, (Math.random()<.6 ? root-5 : root-13), t, .22, 1.2);
      // right hand: sparse phrases from the scale, leaning on chord tones, with rests between phrases
      if (s16 % 2 === 0){
        if (phraseRest > 0) phraseRest--;
        else if (Math.random() < .55 && step - lastMel >= 2){
          let cand = mel + Math.round((Math.random()-.5)*5);
          cand = Math.max(0, Math.min(scale.length-1, cand));
          const inChord = chord.some(c => (scale[cand]-c)%12===0);
          if (!inChord && Math.random() < .5) cand = Math.max(0, Math.min(scale.length-1, cand + (Math.random()<.5?-1:1)));
          mel = cand; lastMel = step;
          const vel = .09 + Math.random()*.07, len = (Math.random()<.3 ? 1.6 : .7);
          piano(music, scale[mel], t + swing + rub, vel, len);
          if (Math.random() < .18) piano(music, scale[mel]-12, t + swing + .04, vel*.5, len); // octave doubling

    ctx = new (window.AudioContext||window.webkitAudioContext)();
    noiseBuf = noise(1);
    master = ctx.createGain(); master.gain.value = 0;
    const lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 5200; // soft felt-piano tone
    music = ctx.createGain(); music.gain.value = .7;

    reverb = ctx.createConvolver(); { const len = ctx.sampleRate*2.2, b = ctx.createBuffer(2, len, ctx.sampleRate); for (let c=0;c<2;c++){ const d=b.getChannelData(c); for (let i=0;i<len;i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/len,3.2); } reverb.buffer = b; }
    const wet = ctx.createGain(); wet.gain.value = .32, dry = ctx.createGain(); dry.gain.value = .85;
    music.connect(lp); lp.connect(dry).connect(master); lp.connect(reverb).connect(wet).connect(master);
    fx = ctx.createGain(); fx.gain.value = .9; fx.connect(master);
    engOsc = ctx.createOscillator(); engOsc.type='sawtooth'; engOsc2 = ctx.createOscillator(); engOsc2.type='square';
    engFilter = ctx.createBiquadFilter(); engFilter.type='lowpass'; engFilter.frequency.value=320;
    engGain = ctx.createGain(); engGain.gain.value = 0;
    engOsc.connect(engFilter); engOsc2.connect(engFilter); engFilter.connect(engGain).connect(master); engOsc.start(); engOsc2.start();
    master.connect(ctx.destination);
  }
  // Background track: the user's own recording (musica.mp3). The synthesized piano is only a fallback if it can't play.
  // The track is 50 minutes long, so it ships in three parts that play back to back and loop; two <audio> elements alternate so the next part is preloaded.
  const parts = ['musica1.mp3','musica2.mp3','musica3.mp3'];
  const players = [document.getElementById('bgm'), document.getElementById('bgm2')];
  let cur = 0, part = 0, bgmOk = true, bgmVol = 0;
  const bgm = { get volume(){ return bgmVol; }, set volume(v){ bgmVol = v; players[cur].volume = v; },
    play(){ const a = players[cur]; if (!a.src || !a.src.endsWith(parts[part])) a.src = parts[part]; a.volume = bgmVol; return a.play(); },
    pause(){ players.forEach(a=>a.pause()); } };
  players.forEach((a,i)=>{
    a.addEventListener('error', ()=>{ bgmOk = false; if (enabled && !on){ on = true; nextT = ctx.currentTime + .05; timer = setInterval(schedule, 120); } });
    a.addEventListener('ended', ()=>{ if (i!==cur) return; part = (part+1)%parts.length; cur = 1-cur; const n = players[cur]; n.src = parts[part]; n.volume = bgmVol; n.play().catch(()=>{}); 
      // preload the part after this one into the idle element
      const idle = players[1-cur]; idle.src = parts[(part+1)%parts.length]; idle.load(); });
    a.addEventListener('timeupdate', ()=>{ if (i!==cur || !a.duration) return; const idle = players[1-cur], next = parts[(part+1)%parts.length]; if (a.duration - a.currentTime < 20 && !(idle.src && idle.src.endsWith(next))){ idle.src = next; idle.load(); } });
  });
  function fadeBgm(to){ const from = bgm.volume, t0 = performance.now(); (function f(){ const k=Math.min(1,(performance.now()-t0)/600); bgm.volume = from + (to-from)*k; if (k<1) requestAnimationFrame(f); else if (to===0) bgm.pause(); })(); }
  function apply(){
    if (!ctx) return;
    master.gain.setTargetAtTime(enabled ? 1 : 0, ctx.currentTime, .15);
    if (ctx.state==='suspended') ctx.resume();
    if (enabled){
      if (bgmOk){ bgm.play().then(()=>fadeBgm(.385)).catch(()=>{ bgmOk = false; if (!on){ on = true; nextT = ctx.currentTime + .05; timer = setInterval(schedule, 120); } }); }
      else if (!on){ on = true; nextT = ctx.currentTime + .05; timer = setInterval(schedule, 120); }
    } else {
      fadeBgm(0);
    }
    const btn = document.getElementById('sound'); btn.classList.toggle('on', enabled); btn.setAttribute('aria-pressed', String(enabled));
    document.getElementById('sound-lbl').textContent = enabled ? 'Música' : 'Silencio';
  }
  return {
    start(){ try{ ensure(); apply(); }catch(e){} },
    enabled(){ return enabled; },
    // achievement chime: two quick rising notes
    ding(){ if (!ctx) return; const t=ctx.currentTime; [[880,0],[1318,.11]].forEach(([f0,o])=>{ const osc=ctx.createOscillator(), g=ctx.createGain(); osc.type='triangle'; osc.frequency.value=f0; g.gain.setValueAtTime(0,t+o); g.gain.linearRampToValueAtTime(.3,t+o+.02); g.gain.exponentialRampToValueAtTime(.001,t+o+.5); osc.connect(g).connect(fx); osc.start(t+o); osc.stop(t+o+.55); }); },
    // the speaker on the start screen: choose music on/off before the game (and its audio) starts
    pretoggle(){ enabled = !enabled; try{ localStorage.setItem('empleado-music', enabled?'on':'off'); }catch(e){} return enabled; },
    toggle(){ enabled = !enabled; try{ localStorage.setItem('empleado-music', enabled?'on':'off'); }catch(e){} this.start(); },
    engine(speed, air){ return; if (!ctx) return; const base = 46 + speed*7 + (air? 40:0); engOsc.frequency.setTargetAtTime(base, ctx.currentTime, .05); engOsc2.frequency.setTargetAtTime(base*1.5, ctx.currentTime, .05); engFilter.frequency.setTargetAtTime(240 + speed*40, ctx.currentTime, .05); engGain.gain.setTargetAtTime(Math.min(.11, .025 + speed*.006), ctx.currentTime, .08); },
    boom(){ if (!ctx) return; const t=ctx.currentTime; hit(fx,t,.9,'lowpass',900,1.2); const o=ctx.createOscillator(), g=ctx.createGain(); o.frequency.setValueAtTime(120,t); o.frequency.exponentialRampToValueAtTime(30,t+.6); g.gain.setValueAtTime(.9,t); g.gain.exponentialRampToValueAtTime(.001,t+.7); o.connect(g).connect(fx); o.start(t); o.stop(t+.75); },
    thud(){ if (!ctx) return; const t=ctx.currentTime; hit(fx,t,.25,'lowpass',500,.6); },
    hop(){ if (!ctx) return; const t=ctx.currentTime; const o=ctx.createOscillator(), g=ctx.createGain(); o.type='triangle'; o.frequency.setValueAtTime(180,t); o.frequency.exponentialRampToValueAtTime(420,t+.18); g.gain.setValueAtTime(.35,t); g.gain.exponentialRampToValueAtTime(.001,t+.25); o.connect(g).connect(fx); o.start(t); o.stop(t+.3); },
    bump(v){ if (!ctx) return; const t=ctx.currentTime; hit(fx,t,.12,'bandpass',600,Math.min(.5,v*.08)); },
    // letters: little bricks tumbling, a soft staggered clay clatter
    clang(v){ if (!ctx) return; const t=ctx.currentTime, vol=Math.min(.35, .08+v*.03), n = 3 + Math.floor(Math.min(5, v));
      for (let i=0;i<n;i++){ const tt = t + i*.055 + Math.random()*.03; hit(fx,tt,.09,'lowpass',900+Math.random()*700,vol*(1-i/n*.5));
        const o=ctx.createOscillator(), g=ctx.createGain(); o.type='sine'; o.frequency.value=220+Math.random()*180; g.gain.setValueAtTime(vol*.5,tt); g.gain.exponentialRampToValueAtTime(.001,tt+.12); o.connect(g).connect(fx); o.start(tt); o.stop(tt+.14); } },
    knock(v){ if (!ctx) return; const t=ctx.currentTime, vol=Math.min(.7, .2+v*.07);
      const o=ctx.createOscillator(), g=ctx.createGain(); o.type='triangle'; o.frequency.setValueAtTime(420+Math.random()*120,t); o.frequency.exponentialRampToValueAtTime(160,t+.08); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+.14); o.connect(g).connect(fx); o.start(t); o.stop(t+.16);
      hit(fx,t,.06,'bandpass',1800,vol*.6); },
    strike(){ if (!ctx) return; const t=ctx.currentTime; [523,659,784,1046].forEach((f0,i)=>{ const o=ctx.createOscillator(), g=ctx.createGain(); o.type='triangle'; o.frequency.value=f0; g.gain.setValueAtTime(0,t+i*.09); g.gain.linearRampToValueAtTime(.35,t+i*.09+.02); g.gain.exponentialRampToValueAtTime(.001,t+i*.09+.6); o.connect(g).connect(fx); o.start(t+i*.09); o.stop(t+i*.09+.7); }); }
  };
})();

// ---------- input ----------
const keys = {fwd:false, back:false, left:false, right:false, brake:false};
let started = false;
const keyMap = {KeyW:'fwd',ArrowUp:'fwd',KeyS:'back',ArrowDown:'back',KeyA:'left',ArrowLeft:'left',KeyD:'right',ArrowRight:'right',ShiftLeft:'brake',ShiftRight:'brake'};
function jump(){
  if (!started || car.air) return;
  car.air = true; car.hop = true; car.vy = 10.5; car.y = Math.max(car.y||0, .01); achieve('salto');
  car.tumble = {x:-.9, z:0, y:0}; // nose lifts slightly, no tumbling
  audio.hop();
  for (let i=0;i<6;i++) puff(car.x+(Math.random()-.5)*2.5, car.z+(Math.random()-.5)*2.5);
}
addEventListener('keydown', e=>{
  if (!started && (e.code==='Enter' || e.code==='Space')) { if (ready) start(); e.preventDefault(); return; }
  if (e.code==='Space' && started){ e.preventDefault(); if (!e.repeat) jump(); return; }
  if (keyMap[e.code]) { keys[keyMap[e.code]] = true; if (started) e.preventDefault(); }
  if (e.code==='KeyR' && started) resetCar();
  if (e.code==='KeyM' && started) audio.toggle();
  if (e.code==='KeyP' && started){ mapview.hidden ? openMap() : closeMap(); }
  if (e.code==='KeyL' && started){ achview.hidden ? openAch() : closeAch(); }
  if (e.code==='Escape'){ closeMap(); closeAch(); }
});
addEventListener('keyup', e=>{ if (keyMap[e.code]) keys[keyMap[e.code]] = false; });
addEventListener('blur', ()=>{ for (const k in keys) keys[k]=false; });
// virtual stick: the finger's first touch is the centre; dragging up/down accelerates/reverses and left/right steers
const stick = {x:0, y:0, id:null, ox:0, oy:0};
{ const zone = document.getElementById('stickzone'), knob = document.getElementById('stick'), R = 56, DEAD = .12;
  const release = e => { if (e.pointerId !== stick.id) return; stick.id = null; stick.x = stick.y = 0; knob.hidden = true; };
  zone.addEventListener('pointerdown', e => { if (stick.id !== null) return; e.preventDefault(); stick.id = e.pointerId; stick.ox = e.clientX; stick.oy = e.clientY;
    const zr = zone.getBoundingClientRect(); knob.style.left = (e.clientX - zr.left) + 'px'; knob.style.top = (e.clientY - zr.top) + 'px'; knob.style.setProperty('--dx','0px'); knob.style.setProperty('--dy','0px'); knob.hidden = false;
    zone.classList.add('used'); try{ zone.setPointerCapture(e.pointerId); }catch(_){} });
  zone.addEventListener('pointermove', e => { if (e.pointerId !== stick.id) return; e.preventDefault();
    const dx = e.clientX - stick.ox, dy = e.clientY - stick.oy, d = Math.hypot(dx,dy), k = d > R ? R/d : 1;
    const nx = dx*k/R, ny = -dy*k/R; stick.x = Math.abs(nx) < DEAD ? 0 : nx; stick.y = Math.abs(ny) < DEAD ? 0 : ny;

const CAR_R = 1.75, LIMIT = 140;
const airtimeEl = document.getElementById('airtime');
function launch(){
  car.y = Math.max(car.y, .1); car.vy = 17 + Math.random()*3; car.air = true; car.hop = false;
  car.speed = Math.max(car.speed, 6) * 1.3;
  car.tumble = {x:-5.2, z:(Math.random()-.5)*.6, y:0}; // one clean backflip, the truck stays in one piece

  audio.boom();
}
function updateCar(dt){
  car.y = car.y||0; car.vy = car.vy||0;

  const thr = started && control ? Math.max(-1, Math.min(1, (keys.fwd?1:0) - (keys.back?1:0) + stick.y)) : 0;
  car.speed += thr * (thr > 0 ? 26 : 20) * (grounded ? 1 : .35) * dt;
  car.speed -= car.speed * (grounded ? (thr ? .55 : 1.6) : .15) * dt;
  if (keys.brake && started && grounded) car.speed -= car.speed * 7 * dt;
  car.speed = Math.max(-8, Math.min(grounded ? 17 : 24, car.speed));
  const want = started && control ? Math.max(-1, Math.min(1, (keys.left?1:0) - (keys.right?1:0) - stick.x)) : 0;
  car.steer += (want - car.steer) * Math.min(1, 10*dt);
  if (grounded) car.h += car.steer * 2.3 * dt * Math.max(-1, Math.min(1, car.speed/5));
  else if (car.hop) car.h += car.steer * 1.2 * dt;
  car.x += Math.sin(car.h) * car.speed * dt;
  car.z += Math.cos(car.h) * car.speed * dt;

  // flight
  if (car.air){
    car.vy -= 30*dt; car.y += car.vy*dt;
    if (car.hop){
      // nose up on the way up, level out on the way down, lean into the turn
      body.rotation.x += ((car.vy > 0 ? -.22 : .12) - body.rotation.x) * Math.min(1, 5*dt);
      body.rotation.z += ((-car.steer*.25) - body.rotation.z) * Math.min(1, 5*dt);
    } else {
      body.rotation.x += car.tumble.x*dt; body.rotation.z += car.tumble.z*dt; body.rotation.y += car.tumble.y*dt;
    }
    if (car.y <= 0){
      const hard = car.vy < -12;
      car.y = 0; car.air = false; car.vy = 0; camShake.v = hard ? .8 : .3; car.speed *= hard ? .6 : .9;
      body.rotation.set(0,0,0); car.hop = false; car.squash = .35;
      for (let i=0;i<(hard?10:5);i++) puff(car.x+(Math.random()-.5)*2.5, car.z+(Math.random()-.5)*2.5);
      audio.thud();
    }
  }
  // landing squash on the suspension
  if (car.squash > 0) car.squash -= dt*1.4;
  // fuel tanks
  for (const tk of tanks){
    if (tk.respawn > 0){
      tk.respawn -= dt;
      const s = tk.respawn < 1 ? 1 - tk.respawn : 0; tk.g.scale.setScalar(Math.max(.001, s)); tk.halo.material.opacity = .6*s;
      if (tk.respawn <= 0){ tk.g.scale.setScalar(1); tk.halo.material.opacity=.6; }
      continue;
    }
    if (Math.hypot(car.x-tk.x, car.z-tk.z) < CAR_R + .8 && !car.air){
      tk.respawn = 6; tk.g.scale.setScalar(.001); tk.halo.material.opacity = 0;
      explode(tk.x, tk.z); launch(); achieve('caja');
    }
  }
  for (const p of boom){ if (p.life > 0){ p.life -= dt; p.vy -= 22*dt; p.m.position.x += p.vx*dt; p.m.position.y += p.vy*dt; p.m.position.z += p.vz*dt; if (p.m.position.y < .2){ p.m.position.y=.2; p.vy*=-.3; p.vx*=.7; p.vz*=.7; } p.m.rotation.x += dt*6; p.m.material.opacity = Math.min(1, p.life*1.5); if (p.life <= 0) p.m.visible=false; } }

  for (const o of obstacles){
    const dx=car.x-o.x, dz=car.z-o.z, d=Math.hypot(dx,dz), min=o.r+CAR_R*.85;
    if (d < min && d > 1e-4){
      const nx=dx/d, nz=dz/d; car.x += nx*(min-d); car.z += nz*(min-d);
      const vdot = (Math.sin(car.h)*nx + Math.cos(car.h)*nz) * car.speed;
      if (vdot < 0) car.speed *= .35;
    }
  }
  if (Math.abs(car.x) > LIMIT){ car.x = Math.sign(car.x)*LIMIT; car.speed *= -.3; }
  if (Math.abs(car.z) > LIMIT){ car.z = Math.sign(car.z)*LIMIT; car.speed *= -.3; }

  // water: sink, drag, bob, ripples
  const wet = inWater(car.x, car.z, .3);
  const depth = wet ? Math.max(0, Math.min(1.1, (SEA_Y + .35) - terrainH(car.x,car.z))) : 0;
  if (wet){
    car.speed -= car.speed * .35 * dt; // light drag: the truck keeps rolling through the water
    if (!car.wasWet){ ripple(car.x,car.z); ripple(car.x,car.z); }
    if (Math.abs(car.speed) > 2 && Math.random() < dt*6) ripple(car.x - Math.sin(car.h)*.8, car.z - Math.cos(car.h)*.8);
  }
  car.wasWet = wet;
  car.dip = (car.dip||0) + (((wet ? -Math.min(.95, .35 + depth*.6) + Math.sin(clock.elapsedTime*2.6)*.06 : 0)) - (car.dip||0)) * Math.min(1, 4*dt);
  const th = terrainH(car.x, car.z), gh = Math.max(th, SEA_Y); // in the sea the truck floats at the surface, wheels under water up to the chassis
  if (started){ if (th < SEA_Y + .3) achieve('mar'); if (Math.abs(car.speed) > 3) achieve('arranque'); if (Math.hypot(car.x-ISLET[0], car.z-ISLET[1]) < 3) achieve('islote'); }
  kart.position.set(car.x, gh + car.dip + car.y, car.z);
  kart.rotation.y = car.h;
  // tilt with the slope
  const ahead = terrainH(car.x+Math.sin(car.h)*1.2, car.z+Math.cos(car.h)*1.2), side = terrainH(car.x+Math.cos(car.h)*.9, car.z-Math.sin(car.h)*.9);
  const tx = wet ? Math.sin(clock.elapsedTime*1.9)*.03 : -(ahead-gh)*.6, tz = wet ? Math.cos(clock.elapsedTime*1.4)*.03 : (side-gh)*.7; // on water: level, with a gentle bob
  kart.rotation.x += (tx - kart.rotation.x)*Math.min(1,6*dt); kart.rotation.z += (tz - kart.rotation.z)*Math.min(1,6*dt);
  if (car.air){ car.vy -= wind.g*0; car.x += wind.x*wind.g*2.5*dt; car.z += wind.z*wind.g*2.5*dt; }
  blob.position.set(car.x, gh+.025, car.z); blob.scale.setScalar(Math.max(.4, 1 - car.y*.08)); blob.material.opacity = Math.max(.06, .22 - car.y*.015);
  if (!car.air){
    body.rotation.z += ((-car.steer * car.speed * .012) - body.rotation.z) * Math.min(1, 8*dt);
    body.rotation.x += ((-thr * .035) - body.rotation.x) * Math.min(1, 6*dt);
  }
  audio.engine(Math.abs(car.speed), car.air);
  pivots.forEach(p=>p.rotation.y = car.steer * .45);
  // suspension: wheels and axles drop away from the body in the air, snap back on landing
  car.stretch = (car.stretch||0) + (((car.air ? .55 : 0)) - (car.stretch||0)) * Math.min(1, (car.air ? 9 : 14)*dt);
  wheels.forEach((w,i)=>{ w.rotation.x += car.speed*dt/WH; w.position.y = -car.stretch + Math.sin(clock.elapsedTime*9 + i*1.7)*Math.min(.08, Math.abs(car.speed)*.006); });
  axles.position.y = -car.stretch;
  shocks.forEach(sh=>{ sh.scale.y = .75 + car.stretch*1.1; }); body.position.y = Math.sin(clock.elapsedTime*7)*Math.min(.05, Math.abs(car.speed)*.004) - (car.squash>0 ? Math.sin(car.squash*Math.PI)*.35 : 0);

  dustT += dt;
  if (!wet && Math.abs(car.speed) > 5 && dustT > .05){
    dustT = 0;
    const bx = car.x - Math.sin(car.h)*1.1, bz = car.z - Math.cos(car.h)*1.1, sx=Math.cos(car.h)*.9, sz=-Math.sin(car.h)*.9;
    puff(bx+sx, bz+sz); puff(bx-sx, bz-sz);
  }
}

const HALF = Math.PI/2;
const CAR_MASS = 6;

const camShake = {v:0};
let sndGate = 0;
// spatial hash: each body only checks the bodies in its own and the 8 neighbouring cells.
// Without it every body was compared against all ~530 others each frame, which spiked to ~20 ms when the wall crumbled.
const hash = { cells: new Map(), used: [], size: 4 };
const gridKey = (ix, iz) => (ix + 512) * 2048 + (iz + 512);
function buildGrid(){
  let maxR = 1; for (const c of bodies) if (c.r > maxR) maxR = c.r;
  hash.size = maxR*2 + 1.5; // two radii plus the distance a body can travel in a frame
  for (const cell of hash.used) cell.length = 0; hash.used.length = 0;
  const s = hash.size;
  for (let i=0;i<bodies.length;i++){
    const c = bodies[i]; c.i = i;
    const k = gridKey(Math.floor(c.x/s), Math.floor(c.z/s));
    let cell = hash.cells.get(k); if (!cell){ cell = []; hash.cells.set(k, cell); }
    if (cell.length === 0) hash.used.push(cell);
    cell.push(c);
  }
}
const nbuf = [];
function neighbours(c){ // fills and returns a reused array, so no allocation per call
  nbuf.length = 0;
  const s = hash.size, ix = Math.floor(c.x/s), iz = Math.floor(c.z/s);
  for (let dx=-1; dx<=1; dx++) for (let dz=-1; dz<=1; dz++){
    const cell = hash.cells.get(gridKey(ix+dx, iz+dz)); if (!cell) continue;
    for (let i=0;i<cell.length;i++) if (cell[i] !== c) nbuf.push(cell[i]);
  }
  return nbuf;
}
const rollAxis = new T.Vector3();
function updateBodies(dt){
  bodies.sort((a,b)=>a.y-b.y);
  buildGrid();
  const cvx = Math.sin(car.h)*car.speed, cvz = Math.cos(car.h)*car.speed;
  let hitMass = 0; // mass the kart hit this frame; the slowdown is applied once, not once per brick
  for (const c of bodies){
    const half = c.h/2;
    // sleeping bodies skip the expensive part until something touches them
    if (c.asleep){ const dx0=c.x-car.x, dz0=c.z-car.z; if (dx0*dx0+dz0*dz0 > (CAR_R+c.r+.6)*(CAR_R+c.r+.6)) continue; c.asleep = false; c.still = 0; }
    // --- kart impact: momentum exchange by mass
    const dx=c.x-car.x, dz=c.z-car.z, d=Math.hypot(dx,dz), min=CAR_R+c.r;
    if (d < min && c.y - half < 2.0){
      const nx=dx/(d||1), nz=dz/(d||1);
      const rel = (cvx-c.vx)*nx + (cvz-c.vz)*nz;
      c.x += nx*(min-d); c.z += nz*(min-d);
      if (rel > 0){
        const j = rel * (CAR_MASS/(CAR_MASS+c.mass)) * 1.6;
        c.vx += nx*j; c.vz += nz*j;
        c.vy += Math.min(9, j*.35) * (c.kind==='rock' ? .6 : 1);
        c.spin += (Math.random()-.5)*j;
        hitMass += c.mass;
        if (c.kind==='pin' || ((c.kind==='brick' || c.kind==='fence' || c.kind==='statue') && j > 2)) c.lying = true;
        if (c.kind==='statue' && j > 2) achieve('estatuas');
        if (c.kind==='letter' && j > 1) achieve('letras'); if (c.kind==='brick' && j > 2) achieve('muro');
        camShake.v = Math.min(1, camShake.v + j*.05*c.mass);
        // one impact sound every 45 ms at most: a crumbling wall used to fire ~180 sounds in a single frame and froze it
        if (j > 1.2 && performance.now() - sndGate > 45){ sndGate = performance.now(); if (c.kind==='letter' || c.kind==='brick' || c.kind==='statue') audio.clang(j); else if (c.kind==='box' || c.kind==='fence') audio.knock(j); else audio.bump(j); }
      }
      c.wake = 1;
    }
    // --- integrate
    c.vy -= 28*dt; c.y += c.vy*dt; c.x += c.vx*dt; c.z += c.vz*dt;
    const wet = inWater(c.x,c.z);
    let floor = Math.max(terrainH(c.x,c.z), SEA_Y - .5) + half;
    if (c.mass < 1.2 && c.y > floor + .3){ c.vx += wind.x*wind.g*3*dt; c.vz += wind.z*wind.g*3*dt; } // light things drift in the wind
    if (c.kind!=='rock' && c.kind!=='tire'){ const nb = neighbours(c); for (let k=0;k<nb.length;k++){ const o = nb[k];
      if (o.kind!=='pin' && o.y < c.y - (o.h+c.h)*.3 && Math.abs(o.x-c.x) < (o.r+c.r)*.85 && Math.abs(o.z-c.z) < (o.r+c.r)*.85) floor = Math.max(floor, o.y + o.h/2 + half);
    } }
    if (c.lying) floor = Math.min(floor, Math.max(terrainH(c.x,c.z), SEA_Y-.5) + c.r);
    if (c.y < floor){
      c.y = floor;
      if (c.kind==='statue' && c.vy < -5 && !c.lying){ c.lying = true; achieve('estatuas'); }
      if (c.vy < -4){ c.vy = -c.vy*(c.kind==='rock'?.3:.2); if (wet) ripple(c.x,c.z); } else c.vy = 0;
      const fr = c.kind==='rock' ? 1.6 : (c.kind==='tire' ? 2.2 : 5);
      const f = Math.exp(-(wet?6:fr)*dt); c.vx*=f; c.vz*=f; c.spin*=f;
    }
    if (wet && c.vy < -.5 && c.y - half < .3) { /* splash once on entry handled by ripple above */ }
    // --- static obstacles (trees, posts)
    for (const o of obstacles){
      const ox=c.x-o.x, oz=c.z-o.z, od=Math.hypot(ox,oz), om=o.r+c.r;
      if (od<om && od>1e-4){ const nx=ox/od, nz=oz/od; c.x+=nx*(om-od); c.z+=nz*(om-od); const vn=c.vx*nx+c.vz*nz; if (vn<0){ c.vx-=nx*vn*1.5; c.vz-=nz*vn*1.5; } }
    }
    c.x = Math.max(-LIMIT,Math.min(LIMIT,c.x)); c.z = Math.max(-LIMIT,Math.min(LIMIT,c.z));
    // fall asleep after resting a while
    if (Math.abs(c.vx)+Math.abs(c.vz)+Math.abs(c.vy) < .03 && Math.abs(c.spin) < .05 && c.y <= floor + .01){ c.still += dt; if (c.still > 1.2) c.asleep = true; } else c.still = 0;
  }
  if (hitMass > 0){ const hm = Math.min(hitMass, 12); car.speed *= 1 - Math.min(.6, hm/(hm+CAR_MASS)*.9); }
  // --- body vs body: mass-weighted circles, only between neighbouring cells
  for (let i=0;i<bodies.length;i++){
    const a=bodies[i]; if (a.asleep) continue;
    const nb = neighbours(a);
    for (let k=0;k<nb.length;k++){
    const b=nb[k];
    if (!b.asleep && b.i < a.i) continue; // awake pairs are handled once, from the lower index
    if (Math.abs(a.y-b.y) > (a.h+b.h)/2 - .05) continue;
    const dx=b.x-a.x, dz=b.z-a.z, d=Math.hypot(dx,dz), min=a.r+b.r;
    if (d < min && d > 1e-4){
      if (a.asleep){ a.asleep=false; a.still=0; } if (b.asleep){ b.asleep=false; b.still=0; }
      const nx=dx/d, nz=dz/d, tot=a.mass+b.mass, wa=b.mass/tot, wb=a.mass/tot, p=(min-d);
      a.x-=nx*p*wa; a.z-=nz*p*wa; b.x+=nx*p*wb; b.z+=nz*p*wb;
      const rv = (b.vx-a.vx)*nx + (b.vz-a.vz)*nz;
      if (rv < 0){
        const k = rv*1.35; // restitution ~.35
        a.vx+=nx*k*wa; a.vz+=nz*k*wa; b.vx-=nx*k*wb; b.vz-=nz*k*wb;
        const hit = -rv*Math.min(wa,wb);
        if (hit > 1.2){ if (a.kind==='pin') a.lying=true; if (b.kind==='pin') b.lying=true; if ((a.kind==='brick'||a.kind==='statue') && hit>2) a.lying=true; if ((b.kind==='brick'||b.kind==='statue') && hit>2) b.lying=true; }
        if (hit > .6){ a.spin += (Math.random()-.5)*hit; b.spin += (Math.random()-.5)*hit; }
      }
    }
    }
  }
  // --- visuals
  for (const c of bodies){
    const m=c.m, sp=Math.hypot(c.vx,c.vz);
    m.position.set(c.x,c.y,c.z);
    if (c.kind==='rock' || c.kind==='tire'){
      // roll: rotate around axis perpendicular to velocity
      if (sp > .05){ rollAxis.set(c.vz, 0, -c.vx).normalize(); m.rotateOnWorldAxis(rollAxis, sp*dt/c.r); }
      continue;
    }
    m.rotation.y += c.spin*dt;
    const airborne = c.y > c.h/2 + .08 && Math.abs(c.vy) > .5;
    if (c.lying){
      const k=Math.min(1,6*dt);
      const dir = c.lieDir ?? (c.lieDir = Math.atan2(c.vx||Math.random()-.5, c.vz||Math.random()-.5));
      const tx = Math.cos(dir)*HALF, tz = Math.sin(dir)*HALF;
      m.rotation.x += (tx - m.rotation.x)*k; m.rotation.z += (-tz - m.rotation.z)*k;
    } else if ((sp > 1.2 || airborne) && c.kind !== 'letter'){ // the big letters slide and spin but stay upright
      m.rotation.x += c.vz*dt*1.4; m.rotation.z -= c.vx*dt*1.4;
    } else {
      const k=Math.min(1,8*dt);
      m.rotation.x += (Math.round(m.rotation.x/HALF)*HALF - m.rotation.x)*k;
      m.rotation.z += (Math.round(m.rotation.z/HALF)*HALF - m.rotation.z)*k;
    }
  }
}
function updateWater(t, dt){
  const s = seaPos.array;
  for (let i=0;i<s.length;i+=3){ const x=seaBase[i], y=seaBase[i+1]; s[i+2] = Math.sin(x*.25 + t*1.1)*.16 + Math.cos(y*.18 - t*.9)*.13 + Math.sin((x+y)*.08 + t*.5)*.12 + Math.sin(x*.9 + y*.7 + t*2.2)*.04; }
  seaPos.needsUpdate = true; seaGeo.computeVertexNormals();
  sparkTex.offset.set(t*.012, -t*.008); sparkTex2.offset.set(-t*.007, t*.011); spark.material.opacity = .25 + Math.max(0, Math.sin(t*.9))*.12;
  for (const m of isletRings){ const k = (t*.35 + m.userData.ph) % 1; m.scale.setScalar(1 + k*.12); m.material.opacity = .3*(1-k); }
  const tide = Math.sin(t*.45);
  for (const f of foamBits){ const reach = 1.2 + Math.max(0,tide)*3.2 + Math.sin(t*.7 + f.off)*1.2; f.m.position.set(f.cx - 1.6 + reach + f.k*1.5, SEA_Y + .22, f.z); f.m.material.opacity = .22 + Math.max(0,tide)*.35; }
  for (let i=ripples.length-1;i>=0;i--){
    const r=ripples[i]; r.life -= dt*1.1; r.m.scale.setScalar(1 + (1-r.life)*4); r.m.material.opacity = Math.max(0,r.life)*.6;
    if (r.life<=0){ scene.remove(r.m); ripples.splice(i,1); }
  }
}

function updateZones(t){
  let near = null;
  for (const zn of zones){
    const d = Math.hypot(car.x-zn.x, car.z-zn.z);
    const inside = d < (activeZone===zn ? PAD_R+1.5 : PAD_R);
    if (inside) near = zn;
    zn.disc.material.opacity += ((inside ? .3 : .12) - zn.disc.material.opacity) * .12;
    const pulse = 1 + Math.sin(t*2.4 + zn.x)*.025;
    zn.ring.scale.setScalar(inside ? 1.04 : pulse);
  }
  for (const pr of projects){
    const d = Math.hypot(car.x-pr.x, car.z-pr.z), inside = d < (activeZone===pr ? PROJ_R+1.5 : PROJ_R);
    if (inside) near = pr;
    pr.ring.material.opacity += ((inside ? .9 : .5) - pr.ring.material.opacity) * .12;
  }
  showZone(started ? near : null);
}

const camPos = new T.Vector3(0, 30, 40), look = new T.Vector3(), camTarget = new T.Vector3(), lookTarget = new T.Vector3();
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clock = new T.Clock();
let rafOk = false;
function frame(){
  rafOk = true; requestAnimationFrame(frame);
  try { tick(); } catch(e){ if (!window.__err1){ window.__err1 = true; console.error(e); } }
}
function tick(){
  const dt = Math.min(.05, clock.getDelta()), t = clock.elapsedTime;
  const night = updateDay(dt);
  miniT += dt; if (started && miniT > .12){ miniT = 0; paintMini(); }
  for (const d of decals) d.m.material.opacity = d.base*(1-night*.75);
  lampGlass.emissiveIntensity = .3 + night*3; for (const l of lampLights) l.intensity = night*1.6;
  updateWind(t, dt); updateCar(dt); updateBodies(dt); updateBowling(dt); updateWater(t, dt); updateZones(t);
  headLight.position.set(car.x + Math.sin(car.h)*3.2, terrainH(car.x,car.z) + car.y + 1.4, car.z + Math.cos(car.h)*3.2);
  skyDome.position.copy(camera.position); stars.position.copy(camera.position);
  for (const d of dust){ if (d.life>0){ d.life -= dt*1.8; d.m.position.y += dt*.6; d.m.scale.setScalar(1+(1-d.life)*1.6); d.m.material.opacity = Math.max(0,d.life)*.45; if (d.life<=0) d.m.visible=false; } }

  const mobile = innerWidth < 640;
  if (!started) camTarget.set(car.x + (mobile ? 8 : 9), mobile ? 13.5 : 10, car.z + (mobile ? 13 : 13.5)); // start screen: three-quarter view of the parked truck with the whole ring in frame
  else camTarget.set(car.x + 3.5, mobile ? 22 : 17, car.z + (mobile ? 19 : 17));
  startRing.material.opacity += ((started ? 0 : .8 + Math.sin(t*2.6)*.15) - startRing.material.opacity) * Math.min(1, 3*dt);
  startHalo.material.opacity = startRing.material.opacity * .3; startRing.visible = startHalo.visible = startRing.material.opacity > .01;
  camPos.lerp(camTarget, 1 - Math.exp(-3.5*dt));
  camera.position.copy(camPos);
  if (camShake.v > 0.01 && !reduce){ camera.position.x += (Math.random()-.5)*camShake.v*.5; camera.position.y += (Math.random()-.5)*camShake.v*.4; camShake.v *= Math.exp(-7*dt); }
  look.lerp(lookTarget.set(car.x + Math.sin(car.h)*car.speed*.12, 0, car.z + Math.cos(car.h)*car.speed*.12), 1 - Math.exp(-6*dt));
  camera.lookAt(look);

  const sd = day.sunDir || new T.Vector3(-.4,.8,.3);
  sun.position.set(car.x + sd.x*40, sd.y*40, car.z + sd.z*40); sun.target.position.set(car.x,0,car.z);
  renderer.render(scene, camera);
}
frame(); window.__started3d = true;
// if rAF never fires (hidden or throttled frame), tick on a timer instead
setTimeout(function poll(){ if (!rafOk){ try{ tick(); }catch(e){} } rafOk = false; setTimeout(poll, 50); }, 500); ready = true; { const g=document.getElementById('go'); g.disabled=false; g.textContent='Clic para empezar'; intro.classList.add('ready'); document.getElementById('load').classList.add('done'); } 
})();
